name: Bug report
description: Something does not work the way the documentation says it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: if prices stopped parsing entirely, it is probably a tgju
        redesign. Use the "tgju changed its markup" template instead — it asks
        for the one thing that makes such a report actionable, the saved page.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest program, or the exact command, that shows the problem.
      render: go
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tgju version`, or the module version from go.mod.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which half is affected
      options:
        - The Go library
        - The HTTP API
        - The CLI
        - The container image
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Errors and logs
      description: The full error, not a paraphrase. Run with --log-level debug if you can.
      render: shell
