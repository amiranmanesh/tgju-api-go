name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Build with exactly the toolchain go.mod asks for. Letting an older runner
  # toolchain download a newer one mixes compiler versions and fails the build.
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check the dependency policy
        run: make deps-check

      - name: Check the OpenAPI document and the site supply chain
        run: make spec docs-check

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which does not pass
    # -coverprofile=coverage.out through to go test intact. bash exists on all
    # three runners, so pinning it keeps one command working everywhere.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool cover -func=coverage.out | tail -n 1
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage profile
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  fuzz:
    name: Fuzz the parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # A short run on every push is enough to catch a regression the seed
      # corpus already covers; the long runs belong in a scheduled job.
      - name: Fuzz
        run: |
          go test -run=xxx -fuzz=FuzzValue -fuzztime=45s ./internal/numfmt
          go test -run=xxx -fuzz=FuzzChange -fuzztime=45s ./internal/numfmt

      - name: Upload any crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: internal/numfmt/testdata/fuzz/

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tgju-api-go:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}

      # A container that starts, answers its own healthcheck and shuts down is
      # the smallest honest proof that the image works.
      - name: Smoke test the image
        run: |
          docker run -d --name tgju -p 8080:8080 tgju-api-go:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/openapi.yaml | head -1
          docker logs tgju
          docker rm -f tgju

  live:
    name: Live check against tgju.org
    runs-on: ubuntu-latest
    # A pull request from a fork must not be able to make the pipeline depend on
    # a third party site, and a red build caused by tgju being down helps
    # nobody. This job reports, it does not block.
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # This is the canary for the whole project: if tgju restyles its pages,
      # every unit test still passes against the saved fixtures and only this
      # job goes red.
      - name: Fetch every board from the real site
        run: |
          go run ./cmd/tgju get currency --keys price_dollar_rl,price_eur
          go run ./cmd/tgju get gold --keys geram18,silver_925
          go run ./cmd/tgju get coin --keys sekee
