name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Nothing is published before the suite passes on the tagged commit. A broken
  # release cannot be unpublished from the module proxy.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Lint
        run: make lint deps-check

      - name: Test
        run: go test -race ./...

      # The tag, the library constant and the changelog must agree. Catching a
      # mismatch here is much cheaper than after the proxy has cached the tag.
      - name: Check the version is consistent
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          constant=$(grep -oE 'Version = "[^"]+"' version.go | cut -d'"' -f2)

          if [ "$version" != "$constant" ]; then
            echo "tag is $TAG but version.go says $constant"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version $version is consistent across the tag, version.go and the changelog"

  binaries:
    name: Binaries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          # GoReleaser needs the full history to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Needed by the attestation step below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}

      # Provenance lets a consumer verify the image really was built from this
      # repository, by this workflow, from this commit.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  proxy:
    name: Warm the Go module proxy
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      # Asking the proxy for the tag is what makes `go get` work immediately and
      # what makes pkg.go.dev index the new version.
      - name: Request the new version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          curl -fsS "https://proxy.golang.org/github.com/amiranmanesh/tgju-api-go/@v/${TAG}.info" \
            && echo "the proxy has $TAG"
